name: Stop superseded stalled verification
on:
  push:
    paths: ['.github/workflows/stop-stalled.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'ci.yml', per_page: 20});
            for (const run of data.workflow_runs) {
              if (run.head_branch === 'master' && run.head_sha !== context.sha && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info(`Cancelled superseded verification ${run.id}`);
              }
            }

# Also collect logs from terminal-test stalls.
