name: Portability and release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: pvim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  perl:
    name: ${{ matrix.os }} Perl ${{ matrix.perl }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        perl: ['5.10', '5.16', '5.24', '5.32', '5.40', '5.42']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Syntax, POD and complete core-only suite
        timeout-minutes: 5
        run: |
          perl -c pvim
          perl -MPod::Checker -e "exit podchecker('pvim')"
          perl tools/wiki.pl --check
          prove -v t
          python tools/pipe_test.py
      - name: POSIX terminal integration
        if: runner.os != 'Windows'
        run: python3 tools/pty_test.py
      - name: Bounded-memory storage benchmark
        if: runner.os == 'Linux' && matrix.perl == '5.10'
        run: /usr/bin/time -v perl tools/benchmark.pl 128
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - run: cpanm --notest Perl::Tidy
      - run: prove -v t/04-tidy.t
  minimal-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bookworm-slim', 'alpine:3.22', 'ubuntu:24.04', 'fedora:43']
    steps:
      - uses: actions/checkout@v4
      - name: Core-only distro Perl, unprivileged tests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            alpine:*) setup='apk add --no-cache perl perl-test-simple perl-pod-parser perl-test-harness-utils' ;;
            fedora:*) setup='dnf -y install util-linux-user perl perl-Test-Simple perl-Pod-Usage perl-Digest-SHA perl-Archive-Tar perl-Pod-Checker' ;;
            *) setup='apt-get update && apt-get install -y --no-install-recommends perl' ;;
          esac
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh -c "$setup && su nobody -s /bin/sh -c 'cd /src && prove t'"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl tools/wiki.pl --check
      - run: python3 tools/wiki_test.py
      - run: perl tools/release.pl
      - name: Verify packaged single file away from source
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cmp pvim pvim-standalone.pl
          cp pvim-standalone.pl "$RUNNER_TEMP/pvim-standalone.pl"
          cd "$RUNNER_TEMP"
          ./pvim-standalone.pl -v
          perl pvim-standalone.pl --version
          perl pvim-standalone.pl --help
          printf 'old old\n' > standalone.pl
          perl pvim-standalone.pl --batch -c '%s/old/new/g' -c w standalone.pl
          test "$(cat standalone.pl)" = 'new new'
  cpan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install author build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libdist-zilla-perl
      - name: Build and test App::Pvim distribution
        run: |
          # Deliberately seed residues to prove GatherDir excludes them.
          mkdir -p tools/__pycache__
          touch CPAN-UNINTENDED.txt tools/audit-residue.log tools/__pycache__/audit.pyc
          dzil build
          version=$(perl pvim --version | cut -d' ' -f2)
          python3 tools/cpan_audit.py "App-Pvim-${version}"
          rm CPAN-UNINTENDED.txt tools/audit-residue.log tools/__pycache__/audit.pyc
          dzil test
      - name: Verify user-local install from CPAN tarball
        run: |
          version=$(perl pvim --version | cut -d' ' -f2)
          mkdir -p "$RUNNER_TEMP/pvim-cpan-test"
          tar -xzf "App-Pvim-${version}.tar.gz" -C "$RUNNER_TEMP/pvim-cpan-test"
          cd "$RUNNER_TEMP/pvim-cpan-test/App-Pvim-${version}"
          perl Makefile.PL INSTALL_BASE="$RUNNER_TEMP/pvim-cpan-install"
          make test
          make install
          "$RUNNER_TEMP/pvim-cpan-install/bin/pvim" -v
          PERL5LIB="$RUNNER_TEMP/pvim-cpan-install/lib/perl5" perl -MApp::Pvim -e 'print "$App::Pvim::VERSION\n"'
      - uses: actions/upload-artifact@v4
        with:
          name: pvim-cpan-distribution
          path: App-Pvim-*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [perl, tidy, minimal-linux, package, cpan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches embedded version
        run: |
          version=$(perl pvim --version | cut -d' ' -f2)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: actions/download-artifact@v4
        with:
          name: pvim-cpan-distribution
          path: dist
      - run: perl tools/release.pl
      - uses: actions/upload-artifact@v4
        with:
          name: pvim-release
          path: dist/*
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `pvim ${tag} — human testing`,
              prerelease: true, generate_release_notes: false,
              body: fs.readFileSync('docs/RELEASE_NOTES.md', 'utf8')
            });
            for (const name of fs.readdirSync('dist')) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name,
                data: fs.readFileSync(`dist/${name}`)
              });
            }
